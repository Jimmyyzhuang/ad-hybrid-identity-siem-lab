# Universal Forwarder inputs (deployed to DC01 and CLIENT01)
# Path: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
# Note: forwarder service must be able to read the Security log
# (ran as LocalSystem in the lab; least-privilege alternative is a service
# account in the "Event Log Readers" group).

[WinEventLog://Security]
disabled = 0
index = windows

[WinEventLog://System]
disabled = 0
index = windows

[WinEventLog://Application]
disabled = 0
index = windows
